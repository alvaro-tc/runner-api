openapi: 3.0.0
paths:
  /api/v1/auth/register:
    post:
      operationId: AuthController_register
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterDto'
      responses:
        '201':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthSessionResponseDto'
        '409':
          description: EMAIL_ALREADY_REGISTERED
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseDto'
      summary: Crea una cuenta y devuelve la sesion iniciada
      tags:
        - auth
  /api/v1/auth/login:
    post:
      operationId: AuthController_login
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginDto'
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthSessionResponseDto'
        '401':
          description: INVALID_CREDENTIALS
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseDto'
      summary: Inicia sesion en un dispositivo
      tags:
        - auth
  /api/v1/auth/refresh:
    post:
      description: >-
        Invalida el token usado y emite uno nuevo con 60 dias desde ahora. Si llega un token ya
        rotado responde TOKEN_REUSE_DETECTED y revoca todas las sesiones del dispositivo.
      operationId: AuthController_refresh
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshDto'
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenPairDto'
        '401':
          description: INVALID_REFRESH_TOKEN o TOKEN_REUSE_DETECTED
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseDto'
      summary: Rota el refresh token
      tags:
        - auth
  /api/v1/auth/logout:
    post:
      description: 'Idempotente: cerrar una sesion ya cerrada responde ok igual.'
      operationId: AuthController_logout
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LogoutDto'
      responses:
        '200':
          description: ''
      summary: Cierra la sesion de este dispositivo
      tags:
        - auth
  /api/v1/auth/sessions:
    get:
      operationId: AuthController_sessions
      parameters: []
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/SessionDto'
      security:
        - access-token: []
      summary: Lista los dispositivos con sesion activa
      tags:
        - auth
  /api/v1/auth/sessions/{id}:
    delete:
      operationId: AuthController_revokeSession
      parameters:
        - name: id
          required: true
          in: path
          schema:
            type: string
      responses:
        '200':
          description: ''
      security:
        - access-token: []
      summary: Cierra la sesion de otro dispositivo
      tags:
        - auth
  /api/v1/auth/forgot-password:
    post:
      description: >-
        Responde siempre lo mismo, exista el email o no: si distinguiera, seria un comprobador
        gratuito de quien tiene cuenta.
      operationId: AuthController_forgotPassword
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ForgotPasswordDto'
      responses:
        '200':
          description: ''
      summary: Pide un enlace de recuperacion
      tags:
        - auth
  /api/v1/auth/reset-password:
    post:
      description: 'Cierra TODAS las sesiones del usuario: si alguien habia entrado, queda fuera.'
      operationId: AuthController_resetPassword
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResetPasswordDto'
      responses:
        '200':
          description: ''
      summary: Cambia la contrasena con el token del correo
      tags:
        - auth
  /api/v1/auth/me:
    get:
      operationId: AuthController_me
      parameters: []
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthUserDto'
      security:
        - access-token: []
      summary: Datos del usuario autenticado
      tags:
        - auth
  /api/v1/users/me:
    get:
      description: >-
        No incluye los campos de salud ni las preferencias: viven en /users/me/health y
        /users/me/preferences, que la app pide solo cuando abre esas pantallas.
      operationId: UsersController_getMe
      parameters: []
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MeDto'
      security:
        - access-token: []
      summary: Perfil completo del usuario autenticado
      tags:
        - users
    patch:
      description: PATCH parcial. Mandar `null` en un campo opcional lo vacia; omitirlo lo deja como esta.
      operationId: UsersController_updateMe
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateMeDto'
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MeDto'
        '409':
          description: EMAIL_ALREADY_REGISTERED
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseDto'
      security:
        - access-token: []
      summary: Actualiza datos personales
      tags:
        - users
  /api/v1/users/me/avatar:
    post:
      description: >-
        Campo `file`, maximo 5 MB. Se valida decodificando la imagen (no por Content-Type), se
        recorta a cuadrado y se reencoda a WebP, lo que ademas elimina el EXIF con la ubicacion.
      operationId: UsersController_uploadAvatar
      parameters: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
                - file
              properties:
                file:
                  type: string
                  format: binary
      responses:
        '201':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AvatarDto'
        '413':
          description: FILE_TOO_LARGE
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseDto'
        '415':
          description: INVALID_IMAGE
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseDto'
      security:
        - access-token: []
      summary: Sube o reemplaza el avatar
      tags:
        - users
    delete:
      operationId: UsersController_removeAvatar
      parameters: []
      responses:
        '200':
          description: ''
      security:
        - access-token: []
      summary: 'Quita el avatar. Idempotente: sin avatar responde ok igual.'
      tags:
        - users
  /api/v1/users/me/preferences:
    get:
      operationId: UsersController_getPreferences
      parameters: []
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PreferencesDto'
      security:
        - access-token: []
      summary: Unidades, tema, idioma, notificaciones, privacidad y onboarding
      tags:
        - users
    patch:
      description: >-
        `notifications` y `privacy` se mezclan con lo guardado, no lo reemplazan: una app vieja no
        borra las banderas que todavia no conoce.
      operationId: UsersController_updatePreferences
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdatePreferencesDto'
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PreferencesDto'
      security:
        - access-token: []
      summary: Actualiza preferencias
      tags:
        - users
  /api/v1/users/me/health:
    get:
      operationId: UsersController_getHealth
      parameters: []
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthProfileDto'
      security:
        - access-token: []
      summary: Lesiones declaradas, sueno e hidratacion
      tags:
        - users
    patch:
      description: '`injuryFlags` reemplaza la lista entera: es una lista editable, no un merge.'
      operationId: UsersController_updateHealth
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateHealthDto'
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthProfileDto'
      security:
        - access-token: []
      summary: Actualiza los datos de salud
      tags:
        - users
  /api/v1/users/me/data:
    delete:
      description: >-
        Irreversible y sin papelera. Cancela primero las inscripciones a carreras que todavia no
        ocurrieron —para que el cupo vuelva al organizador— y despues borra en cascada perfil,
        entrenamientos, posiciones GPS, planes, sesiones y archivos subidos. Las sesiones se van con
        el usuario, asi que no hay refresh posible; el access token que ya estuviera en la calle
        caduca solo en 15 minutos y mientras tanto no resuelve a nadie.
      operationId: UsersController_deleteAccount
      parameters: []
      responses:
        '200':
          description: La cuenta ya no existe
      security:
        - access-token: []
      summary: Borra la cuenta y todos sus datos
      tags:
        - users
  /api/v1/users/me/highlights:
    get:
      description: >-
        La semana es Lunes-Domingo en la zona horaria de la app (DEFAULT_TIMEZONE), no en UTC: en La
        Paz, correr un domingo por la noche caeria en la semana siguiente si fuera UTC.
      operationId: UsersController_getHighlights
      parameters: []
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HighlightsDto'
      security:
        - access-token: []
      summary: Kilometraje de la semana y carrera mas larga
      tags:
        - users
  /api/v1/users/me/shoes:
    get:
      operationId: ShoesController_list
      parameters:
        - name: includeRetired
          required: false
          in: query
          schema:
            type: boolean
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ShoeDto'
      security:
        - access-token: []
      summary: Zapatillas del usuario, la principal primero
      tags:
        - users
    post:
      description: La primera zapatilla en uso queda como principal automaticamente.
      operationId: ShoesController_create
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateShoeDto'
      responses:
        '201':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ShoeDto'
      security:
        - access-token: []
      summary: Registra un par
      tags:
        - users
  /api/v1/users/me/shoes/{id}:
    patch:
      description: Marcar principal desmarca el anterior en la misma transaccion.
      operationId: ShoesController_update
      parameters:
        - name: id
          required: true
          in: path
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateShoeDto'
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ShoeDto'
        '404':
          description: NOT_FOUND
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseDto'
      security:
        - access-token: []
      summary: Edita un par, lo retira o lo marca como principal
      tags:
        - users
    delete:
      description: >-
        Borrado real: el kilometraje de la zapatilla es un contador, y los entrenamientos guardan su
        propia distancia. Para conservar el historial de uso, retirala en vez de borrarla.
      operationId: ShoesController_remove
      parameters:
        - name: id
          required: true
          in: path
          schema:
            type: string
      responses:
        '404':
          description: NOT_FOUND
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseDto'
      security:
        - access-token: []
      summary: Borra un par
      tags:
        - users
  /api/v1/registrations:
    get:
      description: >-
        Con `?marathonId=` sirve para retomar un borrador cuando la app perdio el id. No recotiza:
        devuelve los totales guardados.
      operationId: RegistrationsController_list
      parameters:
        - name: status
          required: false
          in: query
          schema:
            type: string
            enum:
              - draft
              - pending_payment
              - confirmed
              - cancelled
              - refunded
        - name: marathonId
          required: false
          in: query
          description: Id o slug de la maraton, para retomar un borrador
          schema:
            type: string
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/RegistrationDto'
      security:
        - access-token: []
      summary: Mis inscripciones
      tags:
        - registrations
    post:
      description: >-
        Si ya hay un borrador para esa maraton lo devuelve actualizado en vez de crear otro. Si ya
        hay una inscripcion confirmada responde ALREADY_REGISTERED.
      operationId: RegistrationsController_create
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateRegistrationDto'
      responses:
        '201':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RegistrationDto'
        '409':
          description: ALREADY_REGISTERED / MARATHON_FULL / REGISTRATION_CLOSED
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseDto'
      security:
        - access-token: []
      summary: 'Paso 1: crea el borrador con los datos personales'
      tags:
        - registrations
  /api/v1/registrations/{id}:
    get:
      description: >-
        Un borrador se recotiza con los precios de hoy; una confirmada devuelve el desglose
        congelado, que es lo que se cobro.
      operationId: RegistrationsController_detail
      parameters:
        - name: id
          required: true
          in: path
          schema:
            type: string
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RegistrationDto'
        '404':
          description: NOT_FOUND
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseDto'
      security:
        - access-token: []
      summary: Detalle de una inscripcion
      tags:
        - registrations
    delete:
      description: >-
        Solo si la carrera todavia no ocurrio. Idempotente. El dorsal se conserva como registro
        historico: por eso los correlativos nunca se reutilizan.
      operationId: RegistrationsController_cancel
      parameters:
        - name: id
          required: true
          in: path
          schema:
            type: string
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RegistrationDto'
        '409':
          description: CANCELLATION_NOT_ALLOWED
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseDto'
      security:
        - access-token: []
      summary: Cancela la inscripcion y libera el cupo
      tags:
        - registrations
  /api/v1/registrations/{id}/category-extras:
    patch:
      description: >-
        La lista de `extras` reemplaza a la anterior: manda la seleccion completa, `[]` para dejarla
        sin extras. `categoryId: null` quita la categoria.
      operationId: RegistrationsController_updateCategoryExtras
      parameters:
        - name: id
          required: true
          in: path
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateCategoryExtrasDto'
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RegistrationDto'
        '409':
          description: REGISTRATION_NOT_EDITABLE / EXTRA_OUT_OF_STOCK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseDto'
      security:
        - access-token: []
      summary: 'Paso 2: categoria y adicionales'
      tags:
        - registrations
  /api/v1/registrations/{id}/quote:
    get:
      description: Llamalo en cada cambio del paso 2. El total no se calcula nunca en el movil.
      operationId: RegistrationsController_quote
      parameters:
        - name: id
          required: true
          in: path
          schema:
            type: string
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QuoteResponseDto'
      security:
        - access-token: []
      summary: Total en vivo de la inscripcion
      tags:
        - registrations
  /api/v1/marathons:
    get:
      description: >-
        Paginado por cursor y ordenado por fecha de largada. Con `status`, una pagina puede venir
        corta o vacia y traer `meta.nextCursor` igual: hay que paginar hasta que sea null.
      operationId: MarathonsController_list
      parameters:
        - name: city
          required: false
          in: query
          description: Coincidencia parcial, sin acentos ni mayusculas
          schema:
            example: La Paz
            type: string
        - name: from
          required: false
          in: query
          description: Largada desde (ISO). Inclusivo
          schema:
            example: '2026-09-01'
            type: string
        - name: to
          required: false
          in: query
          description: Largada hasta (ISO). Inclusivo
          schema:
            example: '2026-12-31'
            type: string
        - name: status
          required: false
          in: query
          description: >-
            Filtra por el estado YA RESUELTO. Como se deriva al leer, el filtrado se hace despues de
            traer las filas: por eso no se combina con paginas enormes.
          schema:
            type: string
            enum:
              - open
              - closing_soon
              - full
              - closed
        - name: limit
          required: false
          in: query
          schema:
            maximum: 50
            default: 20
            type: number
        - name: cursor
          required: false
          in: query
          description: El `meta.nextCursor` de la pagina anterior. Opaco.
          schema:
            type: string
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/MarathonSummaryDto'
      summary: Catalogo de maratones publicadas
      tags:
        - marathons
  /api/v1/marathons/upcoming:
    get:
      description: Solo las que todavia no largaron, ordenadas de la mas proxima a la mas lejana.
      operationId: MarathonsController_upcoming
      parameters:
        - name: limit
          required: false
          in: query
          schema:
            maximum: 50
            default: 5
            type: number
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/MarathonSummaryDto'
      summary: Proximas carreras, para el carrusel del home
      tags:
        - marathons
  /api/v1/marathons/{slug}:
    get:
      description: >-
        Acepta el slug o el id. Trae categorias y extras embebidos: son lo que pinta la pantalla de
        detalle, y pedirlos aparte serian tres viajes para una sola vista.
      operationId: MarathonsController_detail
      parameters:
        - name: slug
          required: true
          in: path
          schema:
            example: maraton-la-paz-3600
            type: string
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MarathonDetailDto'
        '404':
          description: NOT_FOUND
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseDto'
      summary: Detalle de una maraton
      tags:
        - marathons
  /api/v1/marathons/{id}/categories:
    get:
      description: Acepta el slug o el id. Existe suelto para el paso 2 de la inscripcion.
      operationId: MarathonsController_categories
      parameters:
        - name: id
          required: true
          in: path
          schema:
            type: string
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/MarathonCategoryDto'
      summary: Categorias de una maraton
      tags:
        - marathons
  /api/v1/marathons/{id}/extras:
    get:
      description: 'Acepta el slug o el id. `stock: null` significa sin limite, no agotado.'
      operationId: MarathonsController_extras
      parameters:
        - name: id
          required: true
          in: path
          schema:
            type: string
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/MarathonExtraDto'
      summary: Extras comprables de una maraton
      tags:
        - marathons
  /api/v1/pricing/quote:
    post:
      description: >-
        No reserva cupo ni stock. Cotizar una carrera cerrada o llena esta permitido: quien decide
        si se puede comprar es el checkout.
      operationId: PricingController_quote
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/QuoteRequestDto'
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QuoteResponseDto'
        '400':
          description: INVALID_CATEGORY / INVALID_EXTRA
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseDto'
        '404':
          description: NOT_FOUND
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseDto'
        '409':
          description: EXTRA_OUT_OF_STOCK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseDto'
      summary: Calcula el total de una inscripcion sin crearla
      tags:
        - pricing
  /api/v1/registrations/{id}/checkout:
    post:
      description: >-
        Recalcula el precio del lado del servidor: no se confia en el total que vio el cliente.
        Primero valida y congela el precio, despues cobra, y solo entonces toma el cupo dentro de
        una transaccion con la maraton bloqueada, asi que dos personas peleando el ultimo lugar no
        entran las dos. Si el cupo se va justo despues del cobro, se reembolsa solo. Con `card` la
        respuesta ya trae la inscripcion `confirmed`; con `qr` y `bank_transfer` vuelve `pending` y
        hay que sondear `GET /payments/:id`.
      operationId: PaymentsController_checkout
      parameters:
        - name: id
          required: true
          in: path
          schema:
            type: string
        - name: idempotency-key
          required: true
          in: header
          schema:
            type: string
        - name: Idempotency-Key
          in: header
          description: >-
            Clave unica de este intento de cobro, generada por el cliente (un uuid v4 sirve).
            Reintentar con la misma clave devuelve el mismo resultado sin volver a cobrar; guardala
            junto al borrador para que sobreviva a un cierre de la app.
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CheckoutDto'
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CheckoutResultDto'
        '400':
          description: IDEMPOTENCY_KEY_REQUIRED / CATEGORY_REQUIRED / PAYMENT_METHOD_NOT_SUPPORTED
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseDto'
        '402':
          description: PAYMENT_DECLINED. `details[0].reason` dice por que.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseDto'
        '409':
          description: MARATHON_FULL / REGISTRATION_CLOSED / EXTRA_OUT_OF_STOCK / IDEMPOTENCY_KEY_CONFLICT
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseDto'
      security:
        - access-token: []
      summary: 'Paso 3: acepta terminos, cobra, reserva el cupo y asigna dorsal'
      tags:
        - payments
  /api/v1/registrations/{id}/payments:
    get:
      description: >-
        Del mas nuevo al mas viejo, rechazos incluidos. Es lo que se pinta en el detalle de Races
        junto al estado del pago.
      operationId: PaymentsController_listOfRegistration
      parameters:
        - name: id
          required: true
          in: path
          schema:
            type: string
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/PaymentDto'
        '404':
          description: NOT_FOUND
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseDto'
      security:
        - access-token: []
      summary: Intentos de cobro de una inscripcion
      tags:
        - payments
  /api/v1/payments/{id}/mock-confirm:
    post:
      description: >-
        Atajo para no esperar los segundos del QR ni montar un banco falso mientras pruebas la
        pantalla a mano. **En produccion responde 404**: un endpoint que da por pagado lo que nadie
        pago no puede existir donde hay dinero de verdad.
      operationId: PaymentsController_mockConfirm
      parameters:
        - name: id
          required: true
          in: path
          schema:
            type: string
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CheckoutResultDto'
        '404':
          description: NOT_FOUND
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseDto'
        '409':
          description: PAYMENT_ALREADY_SETTLED / MARATHON_FULL
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseDto'
      security:
        - access-token: []
      summary: Fuerza la confirmacion de un cobro pendiente (solo desarrollo)
      tags:
        - payments
  /api/v1/payments/{id}:
    get:
      description: >-
        Es el endpoint de **polling** del QR: cada lectura resuelve el cobro si ya toca (se pago
        solo, o caduco), asi que basta con sondear esta ruta cada 2-3 s y mirar `status`. Deja de
        sondear cuando salga de `pending`.
      operationId: PaymentsController_detail
      parameters:
        - name: id
          required: true
          in: path
          schema:
            type: string
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaymentDto'
        '404':
          description: NOT_FOUND
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseDto'
      security:
        - access-token: []
      summary: Detalle de un pago propio
      tags:
        - payments
  /api/v1/payments/{id}/receipt:
    get:
      description: >-
        Devuelve la URL del PDF, en espanol y con los montos en Bs. Se genera la primera vez y se
        reutiliza: sale de los datos congelados de la inscripcion, asi que regenerarlo daria siempre
        lo mismo. **No es una factura**: no esta dosificado y no da credito fiscal.
      operationId: PaymentsController_receipt
      parameters:
        - name: id
          required: true
          in: path
          schema:
            type: string
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReceiptDto'
        '404':
          description: NOT_FOUND
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseDto'
        '409':
          description: 'RECEIPT_NOT_AVAILABLE: el cobro no llego a `paid`'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseDto'
      security:
        - access-token: []
      summary: Comprobante de pago en PDF
      tags:
        - payments
  /api/v1/payments/webhook:
    post:
      description: >-
        Responde 200 aunque el evento no se pueda aplicar (`handled: false`): un proveedor que
        recibe un error reintenta, y reintentar algo que nunca vamos a poder procesar es un bucle.
        Solo la firma invalida corta con 401.
      operationId: PaymentsController_webhook
      parameters:
        - name: X-Paceup-Signature
          in: header
          description: Formato `t=<epoch>,v1=<hmac-sha256 de "t.cuerpo">`
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WebhookEventDto'
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WebhookResultDto'
        '401':
          description: 'INVALID_WEBHOOK_SIGNATURE: firma ausente, incorrecta o fuera de la ventana'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseDto'
      security:
        - access-token: []
      summary: Recibe un evento del proveedor de pagos
      tags:
        - payments
  /api/v1/routes:
    get:
      description: 'Sin geometria: es la lista con la que se elige uno. Ordenados por ciudad y distancia.'
      operationId: RoutesController_list
      parameters:
        - name: city
          required: false
          in: query
          description: Coincidencia parcial
          schema:
            example: La Paz
            type: string
        - name: includeArchived
          required: false
          in: query
          description: >-
            Incluye los archivados. Solo sirve para el panel: la app nunca ofrece un recorrido
            retirado para una carrera nueva.
          schema:
            default: false
            type: boolean
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/RouteSummaryDto'
      summary: Recorridos disponibles
      tags:
        - routes
  /api/v1/routes/{id}:
    get:
      description: >-
        Acepta el slug o el id. El `LineString` viene simplificado para dibujarlo en el movil; con
        `?full=true` sale tal como se cargo.
      operationId: RoutesController_detail
      parameters:
        - name: id
          required: true
          in: path
          schema:
            example: circuito-zona-sur
            type: string
        - name: full
          required: false
          in: query
          description: Devuelve la geometria tal como se cargo, sin simplificar. Para el panel.
          schema:
            default: false
            type: boolean
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RouteDetailDto'
        '404':
          description: NOT_FOUND
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseDto'
      summary: Un recorrido con su trazado
      tags:
        - routes
  /api/v1/training-plans/templates:
    get:
      description: 'Sin paginar: son pocas y caben en una respuesta.'
      operationId: TrainingPlansController_templates
      parameters:
        - name: goalDistance
          required: false
          in: query
          description: Distancia objetivo en metros
          schema:
            example: 21097
            type: number
        - name: level
          required: false
          in: query
          schema:
            type: string
            enum:
              - beginner
              - intermediate
              - advanced
        - name: weeks
          required: false
          in: query
          description: Duracion exacta en semanas
          schema:
            example: 12
            type: number
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/TemplateSummaryDto'
      summary: Catalogo de plantillas de plan
      tags:
        - training-plans
  /api/v1/training-plans/templates/{slug}:
    get:
      description: >-
        Acepta el slug o el id. Las sesiones traen `paceFactor`, no ritmos: los ritmos concretos
        aparecen al instanciar el plan, cuando ya se conoce el ritmo base del corredor.
      operationId: TrainingPlansController_template
      parameters:
        - name: slug
          required: true
          in: path
          schema:
            example: 10k-principiante-10s
            type: string
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TemplateDetailDto'
        '404':
          description: NOT_FOUND
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseDto'
      summary: Detalle de una plantilla, con todas sus sesiones
      tags:
        - training-plans
  /api/v1/training-plans/suggestions:
    get:
      description: >-
        Ordenadas por ajuste. `fits: false` no significa descartada: significa que entra recortando
        semanas de base, y `effectiveWeeks` dice cuantas quedarian.
      operationId: TrainingPlansController_suggestions
      parameters:
        - name: marathonId
          required: true
          in: query
          description: Id o slug de la maraton objetivo
          schema:
            type: string
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/SuggestionDto'
        '404':
          description: NOT_FOUND
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseDto'
      summary: Plantillas que sirven para una maraton concreta
      tags:
        - training-plans
  /api/v1/training-plans/me:
    get:
      operationId: TrainingPlansController_mine
      parameters: []
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MyPlansDto'
      security:
        - access-token: []
      summary: Plan activo del usuario e historial de planes cerrados
      tags:
        - training-plans
  /api/v1/training-plans/me/current:
    get:
      description: Sin `week`, la semana que corresponde a hoy. Fuera de rango se acota a 1..N.
      operationId: TrainingPlansController_current
      parameters:
        - name: week
          required: false
          in: query
          description: Semana a mostrar. Por defecto, la que corresponde a hoy
          schema:
            type: number
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CurrentPlanWeekDto'
        '404':
          description: 'NOT_FOUND: no hay plan activo'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseDto'
      security:
        - access-token: []
      summary: Una semana del plan activo
      tags:
        - training-plans
  /api/v1/training-plans:
    post:
      description: >-
        Con `marathonId`, el plan se ancla a la semana de la carrera y se recorta desde las semanas
        de base si no entra entero. Solo puede haber un plan activo: con otro en curso hay que
        mandar `replaceActive: true`.
      operationId: TrainingPlansController_create
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreatePlanDto'
      responses:
        '201':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlanDto'
        '409':
          description: PLAN_ALREADY_ACTIVE, PLAN_DOES_NOT_FIT
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseDto'
      security:
        - access-token: []
      summary: Instanciar un plan a partir de una plantilla
      tags:
        - training-plans
  /api/v1/training-plans/sessions/{id}/complete:
    patch:
      description: Cuando no queda ninguna sesion abierta, el plan pasa solo a `completed`.
      operationId: TrainingPlansController_complete
      parameters:
        - name: id
          required: true
          in: path
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CompleteSessionDto'
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlanSessionDto'
        '409':
          description: SESSION_NOT_PENDING
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseDto'
      security:
        - access-token: []
      summary: 'Marcar una sesion como hecha, o saltada con `skipped: true`'
      tags:
        - training-plans
  /api/v1/training-plans/sessions/{id}/reschedule:
    patch:
      description: La semana no cambia. Se conserva la fecha original en `rescheduledFromDate`.
      operationId: TrainingPlansController_reschedule
      parameters:
        - name: id
          required: true
          in: path
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RescheduleSessionDto'
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlanSessionDto'
        '400':
          description: VALIDATION_ERROR
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseDto'
      security:
        - access-token: []
      summary: Mover una sesion a otro dia dentro del plan
      tags:
        - training-plans
  /api/v1/training-plans/{id}/abandon:
    patch:
      operationId: TrainingPlansController_abandon
      parameters:
        - name: id
          required: true
          in: path
          schema:
            type: string
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlanDto'
        '409':
          description: PLAN_NOT_ACTIVE
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseDto'
      security:
        - access-token: []
      summary: Abandonar el plan activo
      tags:
        - training-plans
  /api/v1/training-plans/{id}/restart:
    post:
      description: 'Rehace las sesiones desde cero: se pierde el progreso anterior.'
      operationId: TrainingPlansController_restart
      parameters:
        - name: id
          required: true
          in: path
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RestartPlanDto'
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlanDto'
        '409':
          description: PLAN_ALREADY_ACTIVE
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseDto'
      security:
        - access-token: []
      summary: Volver a empezar el mismo plan desde otra fecha
      tags:
        - training-plans
  /api/v1/training-plans/{id}:
    delete:
      description: >-
        Borrado real: un plan se puede regenerar desde su plantilla. Los entrenamientos asociados no
        se tocan, solo pierden el vinculo con la sesion.
      operationId: TrainingPlansController_remove
      parameters:
        - name: id
          required: true
          in: path
          schema:
            type: string
      responses:
        '204':
          description: Borrado
      security:
        - access-token: []
      summary: Borrar un plan
      tags:
        - training-plans
  /api/v1/workouts/sessions:
    post:
      description: >-
        Idempotente por `clientUuid`: repetir la llamada devuelve la sesion existente con un
        `ingestToken` **nuevo** (el anterior queda invalidado). Solo puede haber una sesion abierta
        por usuario.
      operationId: WorkoutSessionsController_start
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StartSessionDto'
      responses:
        '201':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StartedSessionDto'
        '409':
          description: 'SESSION_ALREADY_ACTIVE: hay otra sesion abierta, ciérrala o descártala'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseDto'
      security:
        - access-token: []
      summary: Arrancar un entrenamiento y su sesion de tracking
      tags:
        - workouts
  /api/v1/workouts/sessions/{id}/pause:
    patch:
      description: >-
        La ingesta sigue abierta: un lote en vuelo trae puntos reales y perderlos seria peor. El
        tiempo parado no se descuenta aquí: sale de las posiciones al consolidar (`movingSeconds`).
      operationId: WorkoutSessionsController_pause
      parameters:
        - name: id
          required: true
          in: path
          schema:
            type: string
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TrackingSessionDto'
        '409':
          description: SESSION_NOT_ACTIVE
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseDto'
      security:
        - access-token: []
      summary: Pausar la sesion
      tags:
        - workouts
  /api/v1/workouts/sessions/{id}/resume:
    patch:
      operationId: WorkoutSessionsController_resume
      parameters:
        - name: id
          required: true
          in: path
          schema:
            type: string
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TrackingSessionDto'
        '409':
          description: SESSION_NOT_ACTIVE
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseDto'
      security:
        - access-token: []
      summary: Reanudar una sesion en pausa
      tags:
        - workouts
  /api/v1/workouts/sessions/{id}/finish:
    post:
      description: >-
        El servidor recalcula distancia, splits, ritmo, elevacion y calorias desde las posiciones.
        `clientReported` se guarda para comparar, pero nunca se publica como métrica.
      operationId: WorkoutSessionsController_finish
      parameters:
        - name: id
          required: true
          in: path
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FinishSessionDto'
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FinishedSessionDto'
        '409':
          description: SESSION_NOT_ACTIVE
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseDto'
      security:
        - access-token: []
      summary: Cerrar la sesion y consolidar las metricas
      tags:
        - workouts
  /api/v1/workouts/sessions/{id}:
    delete:
      description: >-
        El entrenamiento queda con `deletedAt` (recuperable desde el panel) y las posiciones se
        borran de verdad: son datos de ubicacion y el usuario pidió tirarlos.
      operationId: WorkoutSessionsController_discard
      parameters:
        - name: id
          required: true
          in: path
          schema:
            type: string
      responses:
        '204':
          description: Descartada
        '409':
          description: SESSION_NOT_ACTIVE
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseDto'
      security:
        - access-token: []
      summary: Descartar la sesion
      tags:
        - workouts
  /api/v1/workouts/sync:
    post:
      description: >-
        Un fallo no tumba el lote: cada entrenamiento se resuelve por separado y la respuesta dice,
        uno a uno, si quedo `created`, `duplicated` o `rejected`. Si el item trae `points`, el
        servidor recalcula distancia, splits y ritmo desde el recorrido; sin puntos se toma lo que
        declaro el usuario y el entrenamiento queda como `manual`.
      operationId: WorkoutsController_sync
      parameters:
        - name: idempotency-key
          required: true
          in: header
          schema:
            type: string
        - name: Idempotency-Key
          in: header
          description: >-
            Clave del lote, generada por el cliente. Reenviar el mismo lote es seguro: cada
            entrenamiento se identifica por su `clientUuid`, que es unico en la base.
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SyncWorkoutsDto'
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SyncResponseDto'
        '400':
          description: IDEMPOTENCY_KEY_REQUIRED
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseDto'
      security:
        - access-token: []
      summary: Subida masiva de entrenamientos grabados sin red
      tags:
        - workouts
  /api/v1/workouts/grouped:
    get:
      description: >-
        Los cortes se hacen en la zona horaria del proyecto, no en UTC: en La Paz una carrera del
        domingo por la tarde es UTC del lunes, y contarla en la semana siguiente seria mentirle al
        usuario.
      operationId: WorkoutsController_grouped
      parameters:
        - name: by
          required: false
          in: query
          schema:
            default: week
            type: string
            enum:
              - week
              - month
        - name: limit
          required: false
          in: query
          description: Cuantos grupos, del mas reciente hacia atras
          schema:
            maximum: 52
            default: 12
            type: number
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GroupedWorkoutsDto'
      security:
        - access-token: []
      summary: Totales por semana o por mes
      tags:
        - workouts
  /api/v1/workouts/stats/weekly:
    get:
      description: >-
        Devuelve siempre las siete casillas de cada semana, incluidas las vacias: la tira Mon-Sun
        necesita los ceros tanto como los kilometros.
      operationId: WorkoutsController_weekly
      parameters:
        - name: weeks
          required: false
          in: query
          description: Cuantas semanas hacia atras, incluida la actual
          schema:
            maximum: 26
            default: 4
            type: number
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WeeklyStatsDto'
      security:
        - access-token: []
      summary: Resumen semanal con la barra de cada dia
      tags:
        - workouts
  /api/v1/workouts:
    get:
      description: 'Del mas reciente al mas viejo. Sin splits: para eso esta el detalle.'
      operationId: WorkoutsController_list
      parameters:
        - name: type
          required: false
          in: query
          schema:
            type: string
            enum:
              - free_run
              - plan_session
              - goal_distance
              - goal_time
              - race
        - name: from
          required: false
          in: query
          description: Desde (ISO). Compara contra `startedAt`. Inclusivo
          schema:
            type: string
        - name: to
          required: false
          in: query
          description: Hasta (ISO). Exclusivo
          schema:
            type: string
        - name: limit
          required: false
          in: query
          schema:
            maximum: 50
            default: 20
            type: number
        - name: cursor
          required: false
          in: query
          description: El `meta.nextCursor` de la pagina anterior. Opaco.
          schema:
            type: string
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/WorkoutSummaryDto'
      security:
        - access-token: []
      summary: Historial filtrado, paginado por cursor
      tags:
        - workouts
  /api/v1/workouts/{id}:
    get:
      operationId: WorkoutsController_detail
      parameters:
        - name: id
          required: true
          in: path
          schema:
            type: string
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkoutDto'
        '404':
          description: NOT_FOUND
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseDto'
      security:
        - access-token: []
      summary: Detalle de un entrenamiento, con sus splits por kilometro
      tags:
        - workouts
    delete:
      description: >-
        Borrado logico (`deletedAt`): deja de aparecer, pero se puede recuperar desde el panel. Los
        kilometros ya sumados a la zapatilla no se restan: el desgaste ocurrio igual.
      operationId: WorkoutsController_remove
      parameters:
        - name: id
          required: true
          in: path
          schema:
            type: string
      responses:
        '204':
          description: Borrado
        '404':
          description: NOT_FOUND
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseDto'
      security:
        - access-token: []
      summary: Borrar un entrenamiento
      tags:
        - workouts
  /api/v1/races/me/summary:
    get:
      description: >-
        El gasto sale de los pagos cobrados, no de los precios del catálogo: un precio cambia y un
        cobro no. Incluye la próxima carrera para la cuenta regresiva de la cabecera.
      operationId: RacesController_summary
      parameters: []
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MyRacesSummaryDto'
      security:
        - access-token: []
      summary: Cuántas corriste, cuánto sumaste y cuánto gastaste
      tags:
        - races
  /api/v1/races/me:
    get:
      description: >-
        Solo inscripciones confirmadas. El corte lo pone la hora de largada, no el resultado: una
        carrera de ayer sin tiempos cargados sigue siendo pasada.
      operationId: RacesController_list
      parameters:
        - name: status
          required: false
          in: query
          description: Sin filtro devuelve las dos
          schema:
            type: string
            enum:
              - upcoming
              - completed
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/RaceSummaryDto'
      security:
        - access-token: []
      summary: Mis carreras, próximas y pasadas
      tags:
        - races
  /api/v1/races/{registrationId}:
    get:
      description: >-
        Métricas completas, marcadores cada 5 km y el recorrido simplificado con Douglas-Peucker
        (máx. 2.000 vértices). Sin resultado todavía, `result` es `null` y el resto viene igual:
        dorsal, logística y hora de largada.
      operationId: RacesController_detail
      parameters:
        - name: registrationId
          required: true
          in: path
          schema:
            type: string
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RaceDetailDto'
        '404':
          description: NOT_FOUND
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseDto'
      security:
        - access-token: []
      summary: Detalle de una carrera
      tags:
        - races
  /api/v1/races/{registrationId}/splits:
    get:
      operationId: RacesController_splits
      parameters:
        - name: registrationId
          required: true
          in: path
          schema:
            type: string
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RaceSplitsDto'
        '409':
          description: 'RESULT_NOT_AVAILABLE: la carrera aún no tiene resultado'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseDto'
      security:
        - access-token: []
      summary: Parciales por kilómetro y marcadores de paso
      tags:
        - races
  /api/v1/races/{registrationId}/receipt:
    get:
      description: >-
        Atajo sobre `/payments/:id/receipt`: resuelve cuál fue el cobro y devuelve el mismo
        documento. **No es una factura**.
      operationId: RacesController_receipt
      parameters:
        - name: registrationId
          required: true
          in: path
          schema:
            type: string
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReceiptDto'
        '409':
          description: 'RECEIPT_NOT_AVAILABLE: ningún pago de esta inscripción llegó a `paid`'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseDto'
      security:
        - access-token: []
      summary: Comprobante de la inscripción en PDF
      tags:
        - races
  /api/v1/races/{registrationId}/share-card:
    post:
      description: >-
        Se regenera en cada llamada sobre la misma URL: el puesto cambia cuando el organizador carga
        los resultados que faltaban, y una imagen cacheada seguiría mostrando el viejo.
      operationId: RacesController_shareCard
      parameters:
        - name: registrationId
          required: true
          in: path
          schema:
            type: string
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ShareCardDto'
        '409':
          description: RESULT_NOT_AVAILABLE
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseDto'
      security:
        - access-token: []
      summary: Tarjeta PNG del resultado, para compartir
      tags:
        - races
  /api/v1/tracking/sessions/{id}/positions:
    post:
      description: >-
        Se autentica con el `ingestToken` de la sesion (`Authorization: Bearer <ingestToken>`),
        **no** con el JWT del usuario. Manda lotes de 15-30 s, nunca punto por punto: una peticion
        por segundo destroza la bateria y no aporta nada. Reenviar un lote es seguro: los repetidos
        se cuentan en `duplicated` y no se duplican. Responde `202` sin calcular metricas — eso pasa
        al cerrar la sesion.
      operationId: TrackingController_positions
      parameters:
        - name: id
          required: true
          in: path
          description: Id de la sesion, el mismo que devolvio el arranque
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/IngestPositionsDto'
      responses:
        '202':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IngestResultDto'
        '401':
          description: 'INVALID_INGEST_TOKEN: el token no existe o no es de esta sesion'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseDto'
        '409':
          description: 'SESSION_NOT_ACTIVE: la sesion ya se cerro o se descarto'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseDto'
        '429':
          description: RATE_LIMITED
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseDto'
      security:
        - ingest-token: []
      summary: Sube un lote de posiciones
      tags:
        - tracking
  /api/v1/tracking/osmand:
    get:
      description: >-
        Un punto por peticion, parametros en la query string. Se identifica con el `uniqueId` del
        dispositivo (`id`) y necesita que ese dispositivo tenga una sesion de tracking abierta.
        `timestamp` acepta unix en segundos, en milisegundos o ISO-8601.
      operationId: TrackingController_osmandIngest
      parameters: []
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IngestResultDto'
        '409':
          description: 'SESSION_NOT_ACTIVE: el dispositivo no tiene ninguna sesion abierta'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseDto'
      summary: Ingesta compatible con OsmAnd/Traccar Client
      tags:
        - tracking
    post:
      operationId: TrackingController_osmandIngestPost
      parameters: []
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IngestResultDto'
      summary: Ingesta compatible con OsmAnd/Traccar Client (POST)
      tags:
        - tracking
  /api/v1/tracking/simulate:
    post:
      description: >-
        Genera puntos a partir de un `LineString` GeoJSON y los mete por el mismo camino que la
        ingesta real. Los tiempos se cuentan hacia atras desde ahora, y si el track no cabe en la
        sesion se retrasa su `startedAt`. En produccion responde 404.
      operationId: TrackingController_simulate
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SimulateDto'
      responses:
        '202':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IngestResultDto'
        '404':
          description: 'NOT_FOUND: en produccion'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseDto'
      security:
        - ingest-token: []
      summary: Simula un recorrido (solo fuera de produccion)
      tags:
        - tracking
  /api/v1/home/summary:
    get:
      description: >-
        Maratón destacada, tiempo estimado de llegada, plan activo con su semana, sesión de hoy y la
        tira Mon–Sun cruzando lo corrido contra lo planificado.


        Nada se cachea: el pull-to-refresh es volver a llamar aquí. La cuenta regresiva la calcula
        el cliente contra `meta.timestamp`, que es la hora del **servidor** — el reloj del teléfono
        puede ir minutos desviado y una carrera no empieza cuando él diga.
      operationId: HomeController_summary
      parameters: []
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HomeSummaryDto'
      security:
        - access-token: []
      summary: Todo el home en una sola llamada
      tags:
        - home
  /api/v1/admin/service-fee:
    get:
      operationId: AdminController_verFees
      parameters: []
      responses:
        '200':
          description: ''
      security:
        - access-token: []
      summary: Config global del cargo por servicio y las maratones que la sobrescriben
      tags:
        - admin
    put:
      description: >-
        Con `enabled: false` el total deja de llevar cargo **y la línea desaparece** de la respuesta
        de cotización: un "Bs 0,00" promete un cargo que hoy no se cobra.
      operationId: AdminController_guardarFeeGlobal
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ServiceFeeConfigDto'
      responses:
        '200':
          description: ''
      security:
        - access-token: []
      summary: Activar, desactivar o reconfigurar el cargo global
      tags:
        - admin
  /api/v1/admin/service-fee/preview:
    get:
      description: >-
        Se calcula con la **misma** función que cobra de verdad, así que no puede desviarse. Sin
        `subtotalCents` usa Bs 200 de ejemplo.
      operationId: AdminController_previsualizar
      parameters:
        - name: subtotalCents
          required: false
          in: query
          description: Subtotal de ejemplo, en centavos
          schema:
            example: 20000
            type: number
        - name: marathonId
          required: false
          in: query
          description: Sin esto se previsualiza la config global
          schema:
            type: string
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FeePreviewDto'
      security:
        - access-token: []
      summary: Vista previa del efecto sobre un total de ejemplo
      tags:
        - admin
  /api/v1/admin/marathons/{id}/service-fee:
    put:
      description: >-
        El override manda **aunque venga apagado**: una maratón con una config `enabled: false` no
        cobra cargo, en vez de caer de vuelta a la global.
      operationId: AdminController_guardarFeeDeMaraton
      parameters:
        - name: id
          required: true
          in: path
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ServiceFeeConfigDto'
      responses:
        '200':
          description: ''
      security:
        - access-token: []
      summary: Override del cargo para una maratón
      tags:
        - admin
    delete:
      operationId: AdminController_quitarFeeDeMaraton
      parameters:
        - name: id
          required: true
          in: path
          schema:
            type: string
      responses:
        '200':
          description: ''
      security:
        - access-token: []
      summary: Quitar el override y volver a la config global
      tags:
        - admin
  /api/v1/admin/routes:
    get:
      description: >-
        Es lo que llena el selector de recorrido del formulario de alta. Con `includeArchived=false`
        salen solo los que se pueden usar en una carrera nueva.
      operationId: AdminController_listarRecorridos
      parameters:
        - name: city
          required: false
          in: query
          description: Coincidencia parcial
          schema:
            example: La Paz
            type: string
        - name: includeArchived
          required: false
          in: query
          description: >-
            Incluye los archivados. Solo sirve para el panel: la app nunca ofrece un recorrido
            retirado para una carrera nueva.
          schema:
            default: false
            type: boolean
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/RouteSummaryDto'
      security:
        - access-token: []
      summary: Recorridos cargados, archivados incluidos
      tags:
        - admin
    post:
      description: >-
        La distancia **no se manda**: se mide sobre la geometría. Es la que después hereda cada
        maratón que lo elija.
      operationId: AdminController_crearRecorrido
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateRouteDto'
      responses:
        '201':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RouteSummaryDto'
        '400':
          description: 'VALIDATION_ERROR: el GeoJSON no es un LineString utilizable'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseDto'
      security:
        - access-token: []
      summary: Cargar un recorrido
      tags:
        - admin
  /api/v1/admin/routes/{id}:
    get:
      description: >-
        Sin simplificar porque desde aquí se edita: reguardar lo simplificado lo iría desgastando en
        cada pasada.
      operationId: AdminController_verRecorrido
      parameters:
        - name: id
          required: true
          in: path
          schema:
            type: string
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RouteDetailDto'
        '404':
          description: NOT_FOUND
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseDto'
      security:
        - access-token: []
      summary: Un recorrido con su trazado sin simplificar
      tags:
        - admin
    put:
      description: >-
        Cambiar la geometría **no toca** las maratones que ya salieron de él: se llevaron su copia,
        y el trazado de una carrera corrida es historia, no configuración.
      operationId: AdminController_editarRecorrido
      parameters:
        - name: id
          required: true
          in: path
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateRouteDto'
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RouteSummaryDto'
      security:
        - access-token: []
      summary: Editar o archivar un recorrido
      tags:
        - admin
    delete:
      description: 'Con carreras detrás se niega: lo que corresponde es archivarlo.'
      operationId: AdminController_borrarRecorrido
      parameters:
        - name: id
          required: true
          in: path
          schema:
            type: string
      responses:
        '409':
          description: 'CONFLICT: hay maratones'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseDto'
      security:
        - access-token: []
      summary: Borrar un recorrido que ninguna maratón usó
      tags:
        - admin
  /api/v1/admin/marathons:
    get:
      description: >-
        A diferencia del catálogo, aquí sí salen las no publicadas. Trae el estado declarado
        (`intent`) junto al resuelto (`resolved`), para que se entienda por qué una maratón
        "abierta" aparece llena.
      operationId: AdminController_listarMaratones
      parameters: []
      responses:
        '200':
          description: ''
      security:
        - access-token: []
      summary: Maratones, publicadas y borradores
      tags:
        - admin
    post:
      description: >-
        Nace **como borrador** salvo que se mande `published: true`: una carrera recién cargada
        suele tener la fecha provisional, y publicarla sola la metería en el catálogo antes de que
        nadie la revise. Sin `slug` se deriva del nombre y se desambigua con un sufijo. Con
        `routeId` la carrera **copia** el recorrido elegido (`GET /admin/routes`): trazado,
        distancia medida y punto de largada. En ese caso `distanceMeters` sobra.
      operationId: AdminController_crearMaraton
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateMarathonDto'
      responses:
        '201':
          description: La maratón creada, con sus categorías y extras
      security:
        - access-token: []
      summary: Crear una maratón
      tags:
        - admin
  /api/v1/admin/marathons/{id}:
    get:
      description: Es lo que rellena el formulario de edición. Trae borradores, como todo aquí.
      operationId: AdminController_verMaraton
      parameters:
        - name: id
          required: true
          in: path
          schema:
            type: string
      responses:
        '404':
          description: NOT_FOUND
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseDto'
      security:
        - access-token: []
      summary: Detalle completo, con categorías y extras
      tags:
        - admin
    put:
      description: >-
        Parcial: lo que no venga en el cuerpo no se toca. `null` sí vacía el campo, que es distinto
        de no mandarlo.
      operationId: AdminController_editarMaraton
      parameters:
        - name: id
          required: true
          in: path
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateMarathonDto'
      responses:
        '200':
          description: ''
      security:
        - access-token: []
      summary: Editar una maratón
      tags:
        - admin
    delete:
      description: >-
        Con inscripciones **se niega**: el borrado en cascada se llevaría pagos, dorsales y
        resultados. Para una carrera vendida lo que corresponde es despublicarla.
      operationId: AdminController_borrarMaraton
      parameters:
        - name: id
          required: true
          in: path
          schema:
            type: string
      responses:
        '409':
          description: 'CONFLICT: tiene inscritos'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseDto'
      security:
        - access-token: []
      summary: Borrar una maratón sin inscritos
      tags:
        - admin
  /api/v1/admin/marathons/{id}/categories:
    post:
      operationId: AdminController_crearCategoria
      parameters:
        - name: id
          required: true
          in: path
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateCategoryDto'
      responses:
        '201':
          description: ''
      security:
        - access-token: []
      summary: Agregar una categoría a una maratón
      tags:
        - admin
  /api/v1/admin/categories/{categoryId}:
    put:
      operationId: AdminController_editarCategoria
      parameters:
        - name: categoryId
          required: true
          in: path
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateCategoryDto'
      responses:
        '200':
          description: ''
      security:
        - access-token: []
      summary: Editar una categoría
      tags:
        - admin
    delete:
      description: >-
        Las inscripciones que la usaban **no se borran**: se quedan sin categoría, con su dorsal y
        su pago intactos. La respuesta dice cuántas quedaron así.
      operationId: AdminController_borrarCategoria
      parameters:
        - name: categoryId
          required: true
          in: path
          schema:
            type: string
      responses:
        '200':
          description: ''
      security:
        - access-token: []
      summary: Borrar una categoría
      tags:
        - admin
  /api/v1/admin/marathons/{id}/extras:
    post:
      operationId: AdminController_crearExtra
      parameters:
        - name: id
          required: true
          in: path
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateExtraDto'
      responses:
        '201':
          description: ''
      security:
        - access-token: []
      summary: Agregar un adicional comprable
      tags:
        - admin
  /api/v1/admin/extras/{extraId}:
    put:
      description: '`stock: null` = sin límite'
      operationId: AdminController_editarExtra
      parameters:
        - name: extraId
          required: true
          in: path
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateExtraDto'
      responses:
        '200':
          description: ''
      security:
        - access-token: []
      summary: Editar un adicional
      tags:
        - admin
    delete:
      description: >-
        Lo ya vendido no se pierde: vive copiado en el `quoteSnapshot` de cada inscripción. Borrarlo
        solo significa que deja de poder comprarse.
      operationId: AdminController_borrarExtra
      parameters:
        - name: extraId
          required: true
          in: path
          schema:
            type: string
      responses:
        '200':
          description: ''
      security:
        - access-token: []
      summary: Borrar un adicional
      tags:
        - admin
  /api/v1/admin/marathons/{id}/publish:
    post:
      operationId: AdminController_publicar
      parameters:
        - name: id
          required: true
          in: path
          schema:
            type: string
      responses:
        '200':
          description: ''
      security:
        - access-token: []
      summary: Publicar una maratón en el catálogo
      tags:
        - admin
  /api/v1/admin/marathons/{id}/unpublish:
    post:
      description: >-
        No cancela nada: las inscripciones vendidas siguen existiendo y sus dueños siguen viendo su
        carrera. Solo deja de aparecer en el catálogo.
      operationId: AdminController_despublicar
      parameters:
        - name: id
          required: true
          in: path
          schema:
            type: string
      responses:
        '200':
          description: ''
      security:
        - access-token: []
      summary: Sacarla del catálogo
      tags:
        - admin
  /api/v1/admin/marathons/{id}/close-registrations:
    post:
      description: >-
        `registrationStatus` guarda la **intención** del admin y solo manda cuando dice `closed`; lo
        demás se deriva de cupos y fechas al leer.
      operationId: AdminController_cerrar
      parameters:
        - name: id
          required: true
          in: path
          schema:
            type: string
      responses:
        '200':
          description: ''
      security:
        - access-token: []
      summary: Cerrar las inscripciones y recalcular el estado
      tags:
        - admin
  /api/v1/admin/marathons/{id}/reopen-registrations:
    post:
      description: Devuelve la columna a `open` y deja que los datos manden otra vez.
      operationId: AdminController_reabrir
      parameters:
        - name: id
          required: true
          in: path
          schema:
            type: string
      responses:
        '200':
          description: ''
      security:
        - access-token: []
      summary: Reabrir las inscripciones
      tags:
        - admin
  /api/v1/admin/marathons/{id}/registrants.csv:
    get:
      description: >-
        Confirmadas y pendientes de pago. Lleva BOM UTF-8 para que Excel no rompa los acentos, y las
        celdas que empiezan por `=` van neutralizadas: un CSV no debe ejecutar nada.
      operationId: AdminController_exportar
      parameters:
        - name: id
          required: true
          in: path
          schema:
            type: string
      responses:
        '200':
          description: Archivo CSV
      security:
        - access-token: []
      summary: Exportar los inscritos a CSV
      tags:
        - admin
  /api/v1/admin/registrations:
    get:
      operationId: AdminController_listarInscripciones
      parameters:
        - name: marathonId
          required: false
          in: query
          schema:
            type: string
        - name: status
          required: false
          in: query
          schema:
            enum:
              - draft
              - pending_payment
              - confirmed
              - cancelled
              - refunded
            type: string
      responses:
        '200':
          description: ''
      security:
        - access-token: []
      summary: Últimas inscripciones, filtrables
      tags:
        - admin
  /api/v1/admin/payments/pending-transfers:
    get:
      description: 'La bandeja de trabajo del admin: quién pagó por banco y falta darle el visto.'
      operationId: AdminController_transferenciasPendientes
      parameters: []
      responses:
        '200':
          description: ''
      security:
        - access-token: []
      summary: Transferencias esperando confirmación manual
      tags:
        - admin
  /api/v1/admin/payments/{id}/confirm-transfer:
    post:
      description: >-
        Toma el cupo y emite el dorsal en la misma transacción que un cobro normal: no hay una
        segunda forma de acreditar un pago. Solo aplica a `bank_transfer` y solo si sigue `pending`.
      operationId: AdminController_confirmarTransferencia
      parameters:
        - name: id
          required: true
          in: path
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ConfirmTransferDto'
      responses:
        '409':
          description: PAYMENT_ALREADY_SETTLED
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseDto'
      security:
        - access-token: []
      summary: Dar por cobrada una transferencia bancaria
      tags:
        - admin
  /api/v1/admin/marathons/{id}/results:
    post:
      description: >-
        Los resultados llegan **por dorsal**, que es como los entrega cualquier cronometraje. Un
        dorsal desconocido no tumba la carga: vuelve en `unknownBibs`. Es idempotente, y los puestos
        se recalculan una sola vez al final.
      operationId: AdminController_importarResultados
      parameters:
        - name: id
          required: true
          in: path
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ImportResultsDto'
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ImportResultsResponseDto'
      security:
        - access-token: []
      summary: Cargar los tiempos de una carrera y recalcular puestos
      tags:
        - admin
  /api/v1/admin/marathons/{id}/recalculate-ranks:
    post:
      description: Para después de corregir un tiempo a mano. Los empates comparten puesto.
      operationId: AdminController_recalcular
      parameters:
        - name: id
          required: true
          in: path
          schema:
            type: string
      responses:
        '200':
          description: ''
      security:
        - access-token: []
      summary: Recalcular puestos sin tocar tiempos
      tags:
        - admin
  /api/v1/admin/users:
    get:
      description: >-
        Ni hash de contraseña, ni tokens, ni ubicaciones: lo que no hace falta aquí no se consulta,
        y así no puede filtrarse por un descuido.
      operationId: AdminController_listarUsuarios
      parameters:
        - name: q
          required: false
          in: query
          description: Busca por email o nombre
          schema:
            type: string
      responses:
        '200':
          description: ''
      security:
        - access-token: []
      summary: Usuarios, sin datos sensibles
      tags:
        - admin
    post:
      description: >-
        Es la **única** forma de crear un administrador: el registro público crea `runner` y punto,
        porque un endpoint abierto que acepte `role` es un escalado de privilegios esperando a que
        alguien lo pruebe. El email queda verificado salvo que se diga lo contrario.
      operationId: AdminController_crearUsuario
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateUserDto'
      responses:
        '409':
          description: EMAIL_ALREADY_REGISTERED
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseDto'
      security:
        - access-token: []
      summary: Crear una cuenta
      tags:
        - admin
  /api/v1/admin/users/{id}:
    put:
      description: >-
        Un admin no puede quitarse a sí mismo el rol: sería dejar el panel sin nadie que pueda
        entrar. Que lo haga otro admin.
      operationId: AdminController_editarUsuario
      parameters:
        - name: id
          required: true
          in: path
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateUserDto'
      responses:
        '409':
          description: CONFLICT / email ocupado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseDto'
      security:
        - access-token: []
      summary: Editar nombre, email, rol o verificación
      tags:
        - admin
    delete:
      description: >-
        Suelta los cupos de sus carreras futuras y borra sus archivos, igual que el borrado que pide
        el propio usuario: es el mismo camino, no una segunda implementación. Un admin no puede
        borrarse a sí mismo desde aquí.
      operationId: AdminController_borrarUsuario
      parameters:
        - name: id
          required: true
          in: path
          schema:
            type: string
      responses:
        '409':
          description: 'CONFLICT: es tu propia cuenta'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseDto'
      security:
        - access-token: []
      summary: Borrar una cuenta
      tags:
        - admin
  /api/v1/admin/users/{id}/password:
    post:
      description: >-
        **Cierra todas sus sesiones.** Un reset que deja vivos los refresh tokens no sirve para lo
        único que se usa de verdad: sacar a quien no debería estar dentro.
      operationId: AdminController_cambiarPassword
      parameters:
        - name: id
          required: true
          in: path
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SetPasswordDto'
      responses:
        '200':
          description: ''
      security:
        - access-token: []
      summary: Ponerle una contraseña nueva a alguien
      tags:
        - admin
  /api/v1/config/app:
    get:
      description: >-
        Se pide una vez al arrancar. Todo lo que hay aqui puede cambiar sin publicar una version de
        la app: el cargo por servicio se apaga desde el panel, la version minima sube por entorno y
        los limites de tracking se calibran en el VPS. Un valor copiado dentro del APK seria una
        mentira el dia que alguien lo cambie.
      operationId: AppInfoController_app
      parameters: []
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AppInfoDto'
      summary: Constantes que el cliente no debe hardcodear
      tags:
        - config
  /health:
    get:
      operationId: HealthController_liveness
      parameters: []
      responses:
        '200':
          description: ''
      summary: 'Liveness: el proceso responde'
      tags:
        - health
  /ready:
    get:
      operationId: HealthController_readiness
      parameters: []
      responses:
        '200':
          description: ''
      summary: 'Readiness: dependencias disponibles'
      tags:
        - health
info:
  title: PaceUp API
  description: |-
    Backend de PaceUp: maratones, inscripciones, planes de entrenamiento y tracking GPS.

    **Unidades base:** distancias en metros, duraciones en segundos, dinero en centavos
    (entero) con `currency`, fechas en ISO-8601 UTC. El formateo (km, min/km, `Bs`) es del cliente.

    **Sobre de respuesta:** todo exito devuelve `{ data, meta }` y todo error `{ error, meta }`.
    Mapea los errores por `error.code`, nunca por `error.message`.
  version: '1.0'
  contact: {}
tags: []
servers:
  - url: http://localhost:3000
    description: Local
  - url: https://api.paceup.example
    description: VPS
components:
  securitySchemes:
    access-token:
      scheme: bearer
      bearerFormat: JWT
      type: http
    ingest-token:
      scheme: bearer
      bearerFormat: JWT
      type: http
      description: El `ingestToken` que devuelve POST /workouts/sessions
  schemas:
    RegisterDto:
      type: object
      properties:
        deviceId:
          type: string
          example: 9f1c8d2e-4b7a-4c11-9f3e-2a1b5c6d7e8f
        deviceName:
          type: string
          example: Pixel 8 de Alvaro
        platform:
          type: string
          example: android
        email:
          type: string
          example: runner@test.com
        password:
          type: string
          example: Test1234!
          minLength: 8
        name:
          type: string
          example: Alvaro Quispe
      required:
        - deviceId
        - email
        - password
        - name
    AuthUserDto:
      type: object
      properties:
        id:
          type: string
        email:
          type: string
        name:
          type: string
        role:
          type: string
          enum:
            - runner
            - admin
        onboardingSeenAt:
          type: object
          nullable: true
          description: Null = el usuario aun no vio el onboarding. Sobrevive a reinstalaciones.
      required:
        - id
        - email
        - name
        - role
        - onboardingSeenAt
    AuthSessionResponseDto:
      type: object
      properties:
        accessToken:
          type: string
        refreshToken:
          type: string
          description: Cadena opaca. Guardala en flutter_secure_storage.
        expiresIn:
          type: number
          example: 900
          description: Segundos de vida del access token
        user:
          $ref: '#/components/schemas/AuthUserDto'
      required:
        - accessToken
        - refreshToken
        - expiresIn
        - user
    ApiErrorDto:
      type: object
      properties:
        code:
          type: string
          example: VALIDATION_ERROR
          description: Codigo estable; mapea por este campo, no por el mensaje
        message:
          type: string
          example: El campo email no es valido
        details:
          example: []
          type: array
          items:
            type: object
      required:
        - code
        - message
        - details
    ResponseMetaDto:
      type: object
      properties:
        requestId:
          type: string
          example: c1f3a0d2-9b7e-4a11-8f2c-5d6e7a8b9c0d
        timestamp:
          type: string
          example: '2026-08-18T14:03:22.118Z'
          description: Hora del servidor, ISO-8601 UTC
        nextCursor:
          type: object
          nullable: true
          description: Cursor de la pagina siguiente
      required:
        - requestId
        - timestamp
    ErrorResponseDto:
      type: object
      properties:
        error:
          $ref: '#/components/schemas/ApiErrorDto'
        meta:
          $ref: '#/components/schemas/ResponseMetaDto'
      required:
        - error
        - meta
    LoginDto:
      type: object
      properties:
        deviceId:
          type: string
          example: 9f1c8d2e-4b7a-4c11-9f3e-2a1b5c6d7e8f
        deviceName:
          type: string
          example: Pixel 8 de Alvaro
        platform:
          type: string
          example: android
        email:
          type: string
          example: runner@test.com
        password:
          type: string
          example: Test1234!
      required:
        - deviceId
        - email
        - password
    RefreshDto:
      type: object
      properties:
        deviceId:
          type: string
          example: 9f1c8d2e-4b7a-4c11-9f3e-2a1b5c6d7e8f
        deviceName:
          type: string
          example: Pixel 8 de Alvaro
        platform:
          type: string
          example: android
        refreshToken:
          type: string
          description: El refresh token entregado en el login o en el refresh anterior
      required:
        - deviceId
        - refreshToken
    TokenPairDto:
      type: object
      properties:
        accessToken:
          type: string
        refreshToken:
          type: string
          description: Cadena opaca. Guardala en flutter_secure_storage.
        expiresIn:
          type: number
          example: 900
          description: Segundos de vida del access token
      required:
        - accessToken
        - refreshToken
        - expiresIn
    LogoutDto:
      type: object
      properties:
        refreshToken:
          type: string
      required:
        - refreshToken
    SessionDto:
      type: object
      properties:
        id:
          type: string
        deviceId:
          type: string
        deviceName:
          type: object
          nullable: true
        platform:
          type: object
          nullable: true
        lastUsedAt:
          type: string
        expiresAt:
          type: string
        current:
          type: boolean
          description: True si es la sesion desde la que estas llamando
      required:
        - id
        - deviceId
        - deviceName
        - platform
        - lastUsedAt
        - expiresAt
        - current
    ForgotPasswordDto:
      type: object
      properties:
        email:
          type: string
          example: runner@test.com
      required:
        - email
    ResetPasswordDto:
      type: object
      properties:
        token:
          type: string
          description: El token que viaja en el enlace del correo
        password:
          type: string
          example: NuevaClave123
          minLength: 8
      required:
        - token
        - password
    UserProfileDto:
      type: object
      properties:
        avatarUrl:
          type: object
          nullable: true
          description: URL absoluta ya resuelta. En la BD se guarda solo la clave del archivo.
        city:
          type: object
          nullable: true
        country:
          type: string
          example: BO
        birthDate:
          type: object
          nullable: true
          example: '1995-04-17'
        gender:
          type: string
          enum:
            - male
            - female
            - other
            - unspecified
        weightGrams:
          type: object
          nullable: true
          example: 72000
        heightCm:
          type: object
          nullable: true
          example: 174
        defaultBibNumber:
          type: object
          nullable: true
      required:
        - avatarUrl
        - city
        - country
        - birthDate
        - gender
        - weightGrams
        - heightCm
        - defaultBibNumber
    MeDto:
      type: object
      properties:
        id:
          type: string
        email:
          type: string
        name:
          type: string
        role:
          type: string
          enum:
            - runner
            - admin
        emailVerifiedAt:
          type: object
          nullable: true
        createdAt:
          type: string
        profile:
          $ref: '#/components/schemas/UserProfileDto'
      required:
        - id
        - email
        - name
        - role
        - emailVerifiedAt
        - createdAt
        - profile
    UpdateMeDto:
      type: object
      properties:
        name:
          type: string
          example: Alvaro Quispe
        email:
          type: string
          example: runner@test.com
          description: 'Cambiarlo pone `emailVerifiedAt` en null: el nuevo buzon no esta verificado.'
        city:
          type: object
          example: La Paz
          nullable: true
        country:
          type: string
          example: BO
          description: ISO-3166-1 alfa-2
        birthDate:
          type: object
          example: '1995-04-17'
          nullable: true
          description: Fecha ISO
        gender:
          type: string
          enum:
            - male
            - female
            - other
            - unspecified
        weightGrams:
          type: object
          example: 72000
          description: Peso en gramos
          nullable: true
        heightCm:
          type: object
          example: 174
          description: Altura en centimetros
          nullable: true
        defaultBibNumber:
          type: object
          example: A-1234
          nullable: true
    AvatarDto:
      type: object
      properties:
        avatarUrl:
          type: string
          example: https://api.paceup.example/uploads/avatars/abc.webp
      required:
        - avatarUrl
    PreferencesDto:
      type: object
      properties:
        units:
          type: string
          enum:
            - metric
            - imperial
        theme:
          type: string
          enum:
            - light
            - dark
            - system
        locale:
          type: string
          example: es-BO
        notifications:
          type: object
          example:
            push: true
        privacy:
          type: object
          example:
            shareWorkouts: true
        onboardingSeenAt:
          type: object
          nullable: true
      required:
        - units
        - theme
        - locale
        - notifications
        - privacy
        - onboardingSeenAt
    UpdatePreferencesDto:
      type: object
      properties:
        units:
          type: string
          enum:
            - metric
            - imperial
        theme:
          type: string
          enum:
            - light
            - dark
            - system
        locale:
          type: string
          example: es-BO
          description: Etiqueta BCP-47
        notifications:
          type: object
          example:
            push: true
            raceReminders: false
        privacy:
          type: object
          example:
            shareWorkouts: true
            liveTrackingOptIn: false
        onboardingSeen:
          type: boolean
          example: true
          description: >-
            true marca el onboarding como visto (con la hora del servidor). false lo reabre, para
            poder volver a mostrar los slides desde ajustes.
    InjuryFlagDto:
      type: object
      properties:
        zone:
          type: string
          example: rodilla_derecha
        since:
          type: string
          example: '2026-03-01'
          description: Desde cuando, fecha ISO
        notes:
          type: string
          example: Molestia al bajar
      required:
        - zone
    HealthProfileDto:
      type: object
      properties:
        injuryFlags:
          type: array
          items:
            $ref: '#/components/schemas/InjuryFlagDto'
        avgSleepMinutes:
          type: object
          nullable: true
          example: 420
        hydrationHabit:
          type: object
          nullable: true
          example: alta
      required:
        - injuryFlags
        - avgSleepMinutes
        - hydrationHabit
    UpdateHealthDto:
      type: object
      properties:
        injuryFlags:
          type: array
          items:
            $ref: '#/components/schemas/InjuryFlagDto'
        avgSleepMinutes:
          type: object
          example: 420
          description: Sueno medio en minutos
          nullable: true
        hydrationHabit:
          type: object
          example: alta
          nullable: true
    LongestWorkoutDto:
      type: object
      properties:
        id:
          type: string
        startedAt:
          type: string
        distanceMeters:
          type: number
          example: 21097
        durationSeconds:
          type: number
          example: 7230
        avgPaceSecPerKm:
          type: object
          nullable: true
          example: 343
      required:
        - id
        - startedAt
        - distanceMeters
        - durationSeconds
        - avgPaceSecPerKm
    HighlightsDto:
      type: object
      properties:
        weekStartsAt:
          type: string
          description: Lunes 00:00 de la semana en curso, en la zona horaria del app
        weekEndsAt:
          type: string
          description: Lunes 00:00 de la semana siguiente (limite exclusivo)
        weekDistanceMeters:
          type: number
          example: 32400
        weekWorkouts:
          type: number
          example: 4
        longestWorkout:
          nullable: true
          type: object
          allOf:
            - $ref: '#/components/schemas/LongestWorkoutDto'
        totalDistanceMeters:
          type: number
          example: 812400
        totalWorkouts:
          type: number
          example: 96
      required:
        - weekStartsAt
        - weekEndsAt
        - weekDistanceMeters
        - weekWorkouts
        - longestWorkout
        - totalDistanceMeters
        - totalWorkouts
    ShoeDto:
      type: object
      properties:
        id:
          type: string
        brand:
          type: string
        model:
          type: string
        distanceMeters:
          type: number
          example: 245300
        alertThresholdMeters:
          type: number
          example: 800000
        isPrimary:
          type: boolean
        retiredAt:
          type: object
          nullable: true
        wearRatio:
          type: number
          example: 0.31
          description: distanceMeters / alertThresholdMeters, redondeado a 2 decimales.
        wearAlert:
          type: boolean
          description: 'true cuando ya paso el umbral: toca sugerir el cambio.'
        createdAt:
          type: string
      required:
        - id
        - brand
        - model
        - distanceMeters
        - alertThresholdMeters
        - isPrimary
        - retiredAt
        - wearRatio
        - wearAlert
        - createdAt
    CreateShoeDto:
      type: object
      properties:
        brand:
          type: string
          example: Asics
        model:
          type: string
          example: Gel-Nimbus 26
        distanceMeters:
          type: number
          example: 120000
          description: Kilometraje ya recorrido antes de registrarla en la app. En metros.
        alertThresholdMeters:
          type: number
