    FeaturesInfoDto:
      type: object
      properties:
        gpsSimulation:
          type: boolean
          example: false
          description: '`POST /tracking/simulate` esta habilitado.'
        liveTracking:
          type: boolean
          example: true
          description: El namespace `/live` esta montado.
        socialLogin:
          type: boolean
          example: false
          description: Login con Google/Facebook/LinkedIn operativo.
      required:
        - gpsSimulation
        - liveTracking
        - socialLogin
    AppInfoDto:
      type: object
      properties:
        currency:
          type: string
          example: BOB
        timezone:
          type: string
          example: America/La_Paz
          description: Zona horaria por defecto de la app.
        defaultLocale:
          type: string
          example: es-BO
        minAppVersion:
          type: string
          example: 1.0.0
          description: >-
            Version minima soportada. Si la del telefono es menor, el cliente debe bloquear y mandar
            a actualizar: por debajo de esta version no se garantiza el contrato.
        deepLinkScheme:
          type: string
          example: paceup
          description: Esquema que abren los enlaces de /links/*.
        serviceFee:
          nullable: true
          description: >-
            `null` cuando el cargo por servicio esta apagado. No es `{ enabled: false }`: es
            ausencia, igual que en las cotizaciones, para que la UI no tenga que pintar una linea en
            cero.
          type: object
          allOf:
            - $ref: '#/components/schemas/ServiceFeeInfoDto'
        tracking:
          $ref: '#/components/schemas/TrackingInfoDto'
        limits:
          $ref: '#/components/schemas/LimitsInfoDto'
        features:
          $ref: '#/components/schemas/FeaturesInfoDto'
      required:
        - currency
        - timezone
        - defaultLocale
        - minAppVersion
        - deepLinkScheme
        - serviceFee
        - tracking
        - limits
        - features
