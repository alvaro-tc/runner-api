            - free_run
            - plan_session
            - goal_distance
            - goal_time
            - race
          default: free_run
        source:
          type: string
          enum:
            - app
            - manual
            - external
          default: app
        planSessionId:
          type: string
        registrationId:
          type: string
        deviceId:
          type: string
          description: '`uniqueId` del dispositivo que lo grabo'
        startedAt:
          type: string
          description: ISO-8601
        endedAt:
          type: string
          description: ISO-8601. Un entrenamiento que se sincroniza ya termino.
        points:
          maxItems: 20000
          description: >-
            El recorrido. Si viene, **manda el servidor**: distancia, splits y ritmo se recalculan
